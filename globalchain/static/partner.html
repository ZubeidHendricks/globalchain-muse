<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231f5c4a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="name">Your store</h1>
      <div class="muted" id="meta"></div>
    </div>
    <a href="/partners">GlobalChain partners</a>
  </header>
  <section id="products"><p class="muted">Loading…</p></section>
  <h3>Ownership NFTs issued</h3>
  <ul class="findings" id="nfts"></ul>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const vid = decodeURIComponent(location.pathname.split("/").pop());

async function load() {
  const res = await fetch(`/v1/partners/${encodeURIComponent(vid)}`);
  if (res.status === 403) {
    document.getElementById("products").innerHTML = `<p>Install the app from <a href="/partners">the partners page</a> to manage this store.</p>`;
    return;
  }
  const d = await res.json();
  const v = d.vendor;
  document.getElementById("name").textContent = v.name;
  document.getElementById("meta").innerHTML = `${esc(v.store_domain)} · <span class="chip authentic">Verified partner</span> · wallet
    ${v.wallet?.explorer_url ? `<a href="${esc(v.wallet.explorer_url)}" target="_blank" rel="noopener" class="mono">${esc(v.wallet.account_id)}</a>` : esc(v.wallet?.account_id)}`;
  document.getElementById("products").innerHTML = d.products.map((p) => `
    <article class="card" style="grid-template-columns:96px 1fr">
      <div>${p.photos[0] ? `<img src="${esc(p.photos[0])}" alt="" style="width:100%;border-radius:8px">` : ""}</div>
      <div><div class="head"><h2>${esc(p.title)}</h2><div class="price">${p.price ? "$" + esc(p.price) : ""}</div></div>
        ${p.registration_id
          ? `<p><span class="chip authentic">Registered</span> <a href="/origin/${esc(p.registration_id)}">${esc(p.registration_id)}</a></p>`
          : `<div class="actions"><button class="primary" data-pid="${esc(p.product_id)}" ${p.photos.length ? "" : "disabled"}>Register at origin</button>
             <span class="muted">${p.photos.length} photo(s)</span></div>`}
      </div></article>`).join("") || `<p class="muted">No products found.</p>`;
  document.querySelectorAll("[data-pid]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true;
    b.textContent = "Registering…";
    const r = await fetch(`/v1/partners/${encodeURIComponent(vid)}/register`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ product_id: b.dataset.pid }) });
    if (!r.ok) { b.textContent = "Failed, try again"; b.disabled = false; return; }
    load();
  }));
  document.getElementById("nfts").innerHTML = d.ownership_nfts.flatMap((w) => w.minted.map((m) => `
    <li><span class="chip ${m.status === "success" ? "authentic" : "counterfeit"}">${esc(m.token_id)} #${m.serial}</span>
      <span>${esc(m.title)} · Shopify order ${esc(w.shopify_order)} · ${m.escrow ? "held in your wallet for the buyer" : "in the buyer's wallet"}</span></li>`)).join("")
    || `<li><span class="muted">None yet. They're minted when Shopify reports an order for a registered product paid.</span></li>`;
}
load();
</script>
</body>
</html>
