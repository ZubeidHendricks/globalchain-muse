<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlobalChain Muse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231f5c4a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>GlobalChain Muse</h1>
      <div class="muted">Your Muse agent talks to vendors' agents, checks every pitch on Hedera, and buys the item's NFT for you.</div>
    </div>
    <span id="wallet" class="tag" hidden></span>
    <span id="engine" class="tag">connecting…</span>
  </header>

  <div class="modes" role="tablist">
    <button type="button" role="tab" data-mode="shop" class="on">My shopping agent</button>
    <button type="button" role="tab" data-mode="make">Maker agent</button>
  </div>
  <form class="ask" id="ask">
    <input id="query" aria-label="Message to the agent">
    <button type="button" id="reset" hidden>New chat</button>
    <button class="primary" id="go">Send</button>
  </form>
  <div class="picker" id="picker" hidden></div>

  <ul class="trace" id="trace"></ul>
  <div class="answer" id="answer" hidden></div>
  <section id="results"></section>

  <p class="disclaimer">
    Scores are evidence-based estimates, not guarantees. A Hedera record proves what was checked and when,
    not that an item is genuine.
  </p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
