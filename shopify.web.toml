# How `shopify app dev` runs the server. The CLI sets PORT, SHOPIFY_APP_URL (its tunnel),
# SHOPIFY_API_KEY and SHOPIFY_API_SECRET.
name = "globalchain"
roles = ["frontend", "backend"]

[commands]
dev = "sh -c 'PUBLIC_BASE_URL=$SHOPIFY_APP_URL exec .venv/bin/uvicorn globalchain.api:app --host 127.0.0.1 --port $PORT'"
